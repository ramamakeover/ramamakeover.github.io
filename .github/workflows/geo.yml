# Weekly AI-search (GEO) audit of the live site. Run it by hand from the Actions tab after any change.
name: GEO audit
on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday, 9:00 am IST
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: Auriti-Labs/geo-optimizer-skill@9795ca348e50cc3653aaebef275ab6defc2aa83f # v4.19.8
        with:
          url: https://ramamakeover.github.io/
          min-score: 0       # report only; never fail
          format: github     # findings show as notes on the run
      - uses: actions/upload-artifact@v4   # full JSON report, downloadable from the run page
        if: always()
        with:
          name: geo-report
          path: geo-report.json
